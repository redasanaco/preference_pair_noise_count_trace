[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "redasanaco-preference_pair_noise_count_trace"
version = "0.1.0"
description = "统计各来源片段的贡献量与占比，标出Agent 应用开发工程师·偏好数据的成对噪声上最主要的来源"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "redasanaco" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://redasanaco.github.io"
Repository = "https://github.com/redasanaco/preference_pair_noise_count_trace"
Issues = "https://github.com/redasanaco/preference_pair_noise_count_trace/issues"

[project.scripts]
preference_pair_noise_count_trace = "preference_pair_noise_count_trace:main"

[tool.setuptools]
py-modules = ["preference_pair_noise_count_trace"]
